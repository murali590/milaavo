server:
  port: 8091

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/milaavo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}


app:

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET}

  refresh-token:
    ttl: 7d
    # Used in R3. Chrome/Firefox allow Secure cookies on http://localhost.
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}

  otp:
    hmac-secret: ${OTP_HMAC_SECRET}

    resend:
      cooldown-seconds: 60
      max-resends: 3
      window-minutes: 15

  sms-outbox:
    poll-delay-ms: 5000
    recovery-delay-ms: 30000
    lease: ${SMS_OUTBOX_LEASE:2m}
    retry-base-delay: 5s
    retry-max-delay: 60s
    encryption-key: ${SMS_OUTBOX_ENCRYPTION_KEY}