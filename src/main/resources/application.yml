server:
  port: 8091

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/milaavo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

logging:
  level:
    org.springframework.security: TRACE

app:
  jwt:
    secret: ${JWT_SECRET}

  otp:
    hmac-secret: ${OTP_HMAC_SECRET}

    resend:
      cooldown-seconds: 60
      max-resends: 3
      window-minutes: 15

  sms-outbox:
    poll-delay-ms: 5000
    recovery-delay-ms: 30000