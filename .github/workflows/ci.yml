name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: exact versions from package-lock.json, and a clean node_modules. Use it in CI, not npm install.
      - run: npm ci
      - run: npm run lint
      # "build" runs tsc -b (type check) and then vite build.
      - run: npm run build

  backend:
    name: Backend (compile, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads, and checks that gradle-wrapper.jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v4

      # TODO (D4b): replace with "./gradlew build" once the stale tests are rewritten.
      - run: ./gradlew --no-daemon compileJava bootJar

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      # Proves the Dockerfile still works. Pushing the image to a registry comes with CD (D6).
      - run: docker build -t milaavo-backend:${{ github.sha }} backend