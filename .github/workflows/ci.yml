name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: exact versions from package-lock.json, and a clean node_modules. Use it in CI, not npm install.
      - run: npm ci
      - run: npm run lint
      # "build" runs tsc -b (type check) and then vite build.
      - run: npm run build

  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, like the "db" service in compose.yaml. Deleted when the job ends.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: milaavo
          POSTGRES_USER: milaavo
          POSTGRES_PASSWORD: milaavo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U milaavo -d milaavo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/milaavo
      DB_USERNAME: milaavo
      DB_PASSWORD: milaavo
      # "local" gives the LocalSmsSender bean, so no real SMS provider is needed.
      SPRING_PROFILES_ACTIVE: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads, and checks that gradle-wrapper.jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v4

      # New random keys every run: nothing to store, nothing to leak.
      - name: Generate throwaway test secrets
        run: |
          for name in JWT_SECRET OTP_HMAC_SECRET SMS_OUTBOX_ENCRYPTION_KEY; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # build = compile + all tests + bootJar.
      - run: ./gradlew --no-daemon build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      # Proves the Dockerfile still works. Pushing the image to a registry comes with CD (D6).
      - run: docker build -t milaavo-backend:${{ github.sha }} backend